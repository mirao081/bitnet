{% extends "dashboard_base.html" %}
{% block title %}Create Wallet{% endblock %}

{% block content %}
<div class="activity-card" id="create-wallet">
    <h2>Create AI Wallet</h2>

    <form method="post">
        {% csrf_token %}
        <label for="plan">Select Investment Plan:</label>
        <select name="plan" id="plan">
            {% for plan in plans %}
                <option value="{{ plan.id }}">
                    {{ plan.name }} - ROI: {{ plan.roi_percent }}% - Min: ${{ plan.min_amount }} - Max: ${{ plan.max_amount }}
                </option>
            {% endfor %}
        </select>
        <button type="submit">Create Wallet</button>
    </form>

    {% if wallet %}
        <h3>Your Wallet</h3>
        <p><strong>Plan:</strong> {{ wallet.plan.name }}</p>
        <p><strong>Balance:</strong> ${{ wallet.balance }}</p>
        <p><strong>Gas Fee Paid:</strong> ${{ wallet.gas_fee_paid }}</p>
    {% endif %}
</div>
{% endblock %}
