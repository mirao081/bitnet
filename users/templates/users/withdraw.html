{% extends "users/dashboard_base.html" %}
{% load static %}

{% block extra_css %}
{% endblock %}

{% block content %}

<div class="withdrawpage-card">

    <form method="post" action="{% url 'users:request_withdrawal' %}">
        {% csrf_token %}

        <!-- Select Asset -->
        <label for="currency" class="withdrawpage-label">
            Select Asset
        </label>

        <select
            id="currency"
            name="currency"
            class="withdrawpage-select"
            required
        >
            <option value="BTC">Bitcoin (BTC)</option>
            <option value="ETH">Ethereum (ETH)</option>
            <option value="USDT_ERC20">USDT ERC20</option>
            <option value="USDT_TRC20">USDT TRC20</option>
        </select>


        <!-- Amount -->
        <label for="amount" class="withdrawpage-label">
            Amount (USD)
        </label>

        <input
            type="number"
            id="amount"
            name="amount"
            class="withdrawpage-input"
            placeholder="Enter withdrawal amount"
            min="200"
            required
        >

        <p class="withdrawpage-note">
            Minimum withdrawal is $200.
        </p>


        <!-- Wallet Address -->
        <label
            for="wallet_address_display"
            class="withdrawpage-label"
        >
            Destination Wallet Address
        </label>

        <!-- Visible wallet address -->
        <input
            type="text"
            id="wallet_address_display"
            class="withdrawpage-input"
            readonly
        >

        <!-- Actual value submitted to Django -->
        <input
            type="hidden"
            id="wallet_address"
            name="wallet_address"
        >


        <div class="withdrawpage-warning">
            <p>
                The selected asset will be withdrawn to the wallet
                address shown above.
            </p>
        </div>


        <button
            type="submit"
            class="withdrawpage-btn"
        >
            Submit Withdrawal
        </button>

    </form>

</div>


<!-- Wallet data generated by Django -->
{{ wallets|json_script:"wallet-data" }}


<script>
document.addEventListener("DOMContentLoaded", function () {

    const currencySelect = document.getElementById("currency");
    const walletDisplay = document.getElementById("wallet_address_display");
    const walletHidden = document.getElementById("wallet_address");

    const walletDataElement = document.getElementById("wallet-data");

    if (!currencySelect || !walletDisplay || !walletHidden || !walletDataElement) {
        console.error("Withdrawal wallet elements were not found.");
        return;
    }

    let wallets = {};

    try {
        wallets = JSON.parse(walletDataElement.textContent);
    } catch (error) {
        console.error("Unable to read wallet data:", error);
        return;
    }


    function updateWalletAddress() {

        const currency = currencySelect.value;

        const walletAddress = wallets[currency] || "";

        // Show wallet address to user
        walletDisplay.value = walletAddress;

        // IMPORTANT:
        // This is the value Django actually receives.
        walletHidden.value = walletAddress;

        console.log("Selected currency:", currency);
        console.log("Wallet address:", walletAddress);
    }


    // Set wallet when page loads
    updateWalletAddress();


    // Change wallet whenever asset changes
    currencySelect.addEventListener("change", function () {
        updateWalletAddress();
    });

});
</script>

{% endblock %}
