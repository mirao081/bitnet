{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login</title>
    <link rel="stylesheet" href="{% static 'users/css/login.css' %}">
</head>
<body class="bitnet-login-body">
    <div class="bitnet-login-container">
        <h2 class="bitnet-login-title">Login to Your Account</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="bitnet-login-button">Login</button>
        </form>
        <p class="bitnet-auth-switch">
            Don’t have an account? <a href="{% url 'crypto:signup' %}">Sign up here</a>
        </p>
    </div>
</body>
</html>
