<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ subject }}</title>
</head>
<body style="font-family: Arial, sans-serif; background-color:#f4f4f4; margin:0; padding:0;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:20px;">
        <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background:#1a73e8; color:#ffffff; padding:20px; text-align:center;">
              <h1>Bitnetapp</h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:30px; color:#333333;">
              <h2 style="margin-top:0;">{{ subject }}</h2>
              <p>Dear <strong>{{ user.username }}</strong>,</p>
              <p>{{ message }}</p>
              <p style="text-align:center; margin:30px 0;">
                <a href="https://bitnetapp.com/dashboard" 
                   style="background:#1a73e8; color:#ffffff; padding:12px 24px; text-decoration:none; border-radius:4px; font-weight:bold;">
                  View Your Account
                </a>
              </p>
              <p>If you have any questions, please contact our support team at 
                <a href="mailto:support@bitnetapp.com">support@bitnetapp.com</a>.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background:#f4f4f4; color:#777777; padding:20px; text-align:center; font-size:12px;">
              © 2026 Bitnetapp. All rights reserved.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
