{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Bitnet</title>
    <link rel="stylesheet" href="{% static 'crypto/css/login.css' %}">
    <!-- Use your actual public site key -->
    <script src="https://www.google.com/recaptcha/api.js?render=6LfYRWotAAAAADZOYTAPexRxP48RWIDrfj7sCAaj"></script>
</head>
<body class="bitnet-login-body">
    <div class="bitnet-login-container">
        <div class="bitnet-login-logo">
            <span class="bitnet-site-name">BitnetFx</span>
        </div>

        <h2 class="bitnet-login-title">Login to Your Account</h2>

        <form method="post" class="bitnet-login-form">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="form-group">
                {{ form.username }}
            </div>
            <div class="form-group">
                {{ form.password }}
            </div>

            <input type="hidden" id="id_captcha" name="captcha">

            <button type="submit" class="bitnet-login-button">Login</button>
        </form>

        <p class="bitnet-auth-switch">
            Don’t have an account? <a href="{% url 'crypto:signup' %}">Sign up here</a>
        </p>
    </div>

    <script>
        grecaptcha.ready(function() {
            grecaptcha.execute('6LfYRWotAAAAADZOYTAPexRxP48RWIDrfj7sCAaj', {action: 'submit'}).then(function(token) {
                document.getElementById('id_captcha').value = token;
            });
        });
    </script>
</body>
</html>
