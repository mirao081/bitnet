{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Bitnethub</title>
    <link rel="stylesheet" href="{% static 'crypto/css/login.css' %}">
    <!-- Google reCAPTCHA v2 Checkbox -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body class="bitnet-login-body">
    <div class="bitnet-login-container">
        <div class="bitnet-login-logo">
            <span class="bitnet-site-name">Bitnethub</span>
        </div>

        <h2 class="bitnet-login-title">Login to Your Account</h2>

        <form method="post" class="bitnet-login-form">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <div class="form-group">
                {{ form.username }}
            </div>
            <div class="form-group">
                {{ form.password }}
            </div>

            <div class="form-group">
                <div class="g-recaptcha" data-sitekey="{{ RECAPTCHA_PUBLIC_KEY }}"></div>
            </div>


            <button type="submit" class="bitnet-login-button">Login</button>
        </form>

        <p class="bitnet-auth-switch">
            Don’t have an account? <a href="{% url 'crypto:signup' %}">Sign up here</a>
        </p>
    </div>
</body>
</html>
